<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Сюрприз</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #050505; --text: #ffffff; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      overflow: hidden; background-color: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    canvas { 
      position: fixed; top: 0; left: 0; 
      width: 100%; height: 100dvh; 
      display: block; z-index: 1; 
    }
    #glowCanvas { pointer-events: none; z-index: 2; }

    /* Верхняя надпись */
    #topText {
      position: fixed;
      top: 12%; 
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      font-size: clamp(16px, 5vw, 24px);
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      opacity: 0;
      transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 15;
      will-change: transform, opacity;
    }
    #topText.visible {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* Контейнер для нижних текстов */
    .bottom-box {
      position: fixed; 
      bottom: 10%; left: 50%;
      transform: translateX(-50%) translateY(30px);
      display: flex; flex-direction: column; align-items: center;
      background: rgba(15, 15, 15, 0.5); /* Стеклянный эффект */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 25px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      opacity: 0;
      transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 10; pointer-events: none;
      text-align: center;
      width: max-content;
      max-width: 90vw;
    }
    .bottom-box.visible {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    #finalText {
      font-size: clamp(32px, 9vw, 56px); 
      font-weight: 900; 
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(160, 196, 255, 0.6);
      margin-bottom: 5px; 
      white-space: nowrap;
      line-height: 1.1;
    }

    #jokeText {
      font-size: clamp(14px, 4.5vw, 18px); 
      font-weight: 500; 
      color: #d0d0d0; 
      line-height: 1.4; 
      white-space: normal;
    }

    #introText {
      position: fixed; top: 50%; left: 50%;
      font-size: clamp(22px, 6vw, 38px);
      font-weight: 400; letter-spacing: 0.08em; text-transform: lowercase;
      color: #fff; white-space: nowrap;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
      transform: translate(-50%, -50%) scale(0.9);
      opacity: 0; filter: blur(10px);
      transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
      will-change: transform, opacity, filter;
      z-index: 15;
    }
    #introText.visible {
      opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0px);
    }
    #introText.hidden {
      opacity: 0; transform: translate(-50%, -50%) scale(1.1); filter: blur(15px);
    }

    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      box-shadow: inset 0 0 150px rgba(0,0,0,0.9); opacity: 0; transition: opacity 3s ease;
    }
    #vignette.visible { opacity: 1; }

    #controls { position: fixed; top: 20px; right: 20px; z-index: 20; display: none; }
    button {
      background: rgba(255, 255, 255, 0.1); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px;
      padding: 10px 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    button:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <canvas id="drawCanvas"></canvas>
  <canvas id="glowCanvas"></canvas>
  
  <div id="introText">смотри че сделал</div>
  <div id="topText">моя лпшка крутышка на фотке</div>
  
  <div class="bottom-box" id="bottomBox">
    <div id="finalText">ОЦЕНИ</div>
    <div id="jokeText">заебало эту фотку юзать,<br>мб новую скинешь >_<</div>
  </div>
  
  <div id="controls">
    <button id="replayBtn" type="button">↻ Ещё раз</button>
  </div>

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const vignette = document.getElementById("vignette");
    const introText = document.getElementById("introText");
    const topText = document.getElementById("topText");
    const bottomBox = document.getElementById("bottomBox");
    
    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const glowCanvas = document.getElementById("glowCanvas");
    const glowCtx = glowCanvas.getContext("2d", { alpha: true });
    
    const controls = document.getElementById("controls");
    const replayBtn = document.getElementById("replayBtn");

    let animId = null;
    let running = false;
    let img = null;
    let sparkles = [];

    class Sparkle {
      constructor(w, h, isInitial = false) {
        this.reset(w, h, isInitial);
      }
      reset(w, h, isInitial = false) {
        this.x = Math.random() * w;
        this.y = isInitial ? Math.random() * h : h + 20;
        this.size = Math.random() * 6 + 2;
        this.speedY = Math.random() * 1.0 + 0.3;
        this.speedX = Math.random() * 0.6 - 0.3;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.fade = Math.random() * 0.003 + 0.001;
        this.color = Math.random() > 0.4 ? "#ffffff" : "#a0c4ff"; 
      }
      update(w, h) {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.opacity -= this.fade;
        if (this.opacity <= 0 || this.y < -20) {
          this.reset(w, h);
        }
      }
      draw(context) {
        if (this.opacity <= 0) return;
        context.save();
        context.globalAlpha = this.opacity;
        context.fillStyle = this.color;
        context.shadowColor = this.color;
        context.shadowBlur = 12;
        
        context.beginPath();
        context.moveTo(this.x, this.y - this.size);
        context.quadraticCurveTo(this.x, this.y, this.x + this.size, this.y);
        context.quadraticCurveTo(this.x, this.y, this.x, this.y + this.size);
        context.quadraticCurveTo(this.x, this.y, this.x - this.size, this.y);
        context.quadraticCurveTo(this.x, this.y, this.x, this.y - this.size);
        context.fill();
        
        context.restore();
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("Ошибка картинки"));
        image.src = src;
      });
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const width = window.innerWidth;
      const height = document.documentElement.clientHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      glowCanvas.width = Math.floor(width * dpr);
      glowCanvas.height = Math.floor(height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      glowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    async function initSequence() {
      if (running || !PHOTO_BASE64 || PHOTO_BASE64.length < 100) return;
      running = true;
      
      canvas.style.transform = "scale(1)";
      vignette.classList.remove("visible");
      bottomBox.classList.remove("visible");
      topText.classList.remove("visible");
      
      introText.classList.remove("visible", "hidden");
      introText.style.display = "block";

      if (!img) {
        try { img = await loadImage(PHOTO_BASE64); } 
        catch (e) { console.error(e); running = false; return; }
      }

      await new Promise(r => setTimeout(r, 100));
      resizeCanvas();

      introText.classList.add("visible");
      try { tg?.HapticFeedback?.impactOccurred("light"); } catch (_) {}

      setTimeout(() => {
        introText.classList.remove("visible");
        introText.classList.add("hidden");
        
        setTimeout(() => {
          introText.style.display = "none";
          startAnimeReveal();
        }, 500); 
      }, 2500); 
    }

    function startAnimeReveal() {
      const width = window.innerWidth;
      const height = document.documentElement.clientHeight;

      const scale = Math.min(width / img.width, height / img.height);
      const drawW = img.width * scale;
      const drawH = img.height * scale;
      const offsetX = (width - drawW) / 2;
      const offsetY = (height - drawH) / 2;

      sparkles = [];
      for (let i = 0; i < 60; i++) {
        sparkles.push(new Sparkle(width, height, true));
      }

      const startTime = performance.now();
      let textShown = false;
      
      function frame(now) {
        const elapsed = now - startTime;

        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, width, height);
        glowCtx.clearRect(0, 0, width, height);

        const opacity = Math.min(1, elapsed / 2000);
        const zoomProgress = Math.min(1, elapsed / 20000);
        const currentScale = 0.96 + (zoomProgress * 0.10);

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.translate(width / 2, height / 2);
        ctx.scale(currentScale, currentScale);
        ctx.translate(-width / 2, -height / 2);
        
        ctx.shadowColor = "rgba(160, 196, 255, 0.25)";
        ctx.shadowBlur = 40;
        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
        ctx.restore();

        sparkles.forEach(s => {
          s.update(width, height);
          s.draw(glowCtx);
        });

        if (opacity >= 1 && !textShown) {
          textShown = true;
          vignette.classList.add("visible");
          controls.style.display = "block";
          
          if (running) running = false;

          // Показываем все тексты
          setTimeout(() => {
            topText.classList.add("visible");
            bottomBox.classList.add("visible");
            try { tg?.HapticFeedback?.notificationOccurred("success"); } catch (_) {}
          }, 200);
        }

        animId = requestAnimationFrame(frame);
      }
      animId = requestAnimationFrame(frame);
    }

    replayBtn.addEventListener("click", () => {
      if (running) return;
      if (animId) cancelAnimationFrame(animId);
      
      controls.style.display = "none";
      topText.classList.remove("visible");
      bottomBox.classList.remove("visible");
      vignette.classList.remove("visible");
      
      canvas.style.transform = "scale(1)";
      
      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, window.innerWidth, document.documentElement.clientHeight);
      glowCtx.clearRect(0, 0, window.innerWidth, document.documentElement.clientHeight);
      
      setTimeout(() => initSequence(), 300);
    });

    window.addEventListener("resize", () => {
      if (!running) resizeCanvas();
    });

    window.addEventListener("load", () => { setTimeout(initSequence, 500); });
  </script>
