<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Сюрприз</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      transform: scale(1);
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
    }
    #stage.zoomed { transform: scale(1.04); }
    
    #drawCanvas {
      display: block; width: 100%; height: 100%;
      object-fit: contain;
    }
    
    #glowCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }

    #caption {
      position: fixed; left: 50%; bottom: 12%;
      transform: translateX(-50%) translateY(12px);
      opacity: 0; transition: opacity 1.5s ease, transform 1.5s ease;
      font-size: clamp(20px, 6vw, 32px); font-weight: 700;
      letter-spacing: 0.02em; text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
      pointer-events: none; white-space: nowrap; z-index: 10;
    }
    #caption.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    #controls {
      position: fixed; top: 16px; right: 16px; z-index: 20;
      display: flex; gap: 10px;
    }
    button {
      background: rgba(255, 255, 255, 0.1); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px;
      padding: 10px 18px; font-size: 14px; font-weight: 500;
      cursor: pointer; backdrop-filter: blur(10px);
      transition: background 0.2s;
      display: none; /* Изначально кнопка скрыта */
    }
    button:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="drawCanvas"></canvas>
    <canvas id="glowCanvas"></canvas>
  </div>
  <div id="caption"></div>
  
  <div id="controls">
    <button id="replayBtn" type="button">↻ Ещё раз</button>
  </div>

      renderCtx.fillStyle = "#0a0a0a";
      renderCtx.fillRect(0, 0, w, h);
      renderCtx.drawImage(img, offsetX, offsetY, drawW, drawH);
      
      const finalImageData = renderCtx.getImageData(0, 0, w, h);
      const pixelsData = finalImageData.data;
      
      const totalPixels = w * h;
      const startTime = performance.now();
      let drawn = 0;

      // Тактильная вибрация при старте
      try { tg?.HapticFeedback?.impactOccurred("light"); } catch (_) {}

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / ANIMATION_DURATION_MS);
        const targetDrawn = Math.floor(totalPixels * progress);
        
        let batch = Math.min(targetDrawn - drawn, Math.ceil(totalPixels / 60));
        if (batch <= 0 && progress < 1) {
          animId = requestAnimationFrame(frame);
          return;
        }

        const end = Math.min(totalPixels, drawn + batch);
        
        const startY = Math.floor(drawn / w);
        const endY = Math.min(h, Math.ceil(end / w));
        const numRows = endY - startY;

        if (numRows > 0) {
          const subData = new ImageData(
            new Uint8ClampedArray(pixelsData.buffer, startY * w * 4, numRows * w * 4),
            w,
            numRows
          );
          ctx.putImageData(subData, 0, startY);
        }
        drawn = end;

        if (drawn > 0 && progress < 1) {
          glowCtx.clearRect(0, 0, cssW, cssH);
          
          const px = (drawn % w) / dpr;
          const py = Math.floor(drawn / w) / dpr;
          
          const radius = Math.max(20, Math.min(cssW, cssH) * 0.1);
          const grad = glowCtx.createRadialGradient(px, py, 0, px, py, radius);
          grad.addColorStop(0, "rgba(255, 255, 255, 0.9)");
          grad.addColorStop(0.1, "rgba(200, 230, 255, 0.5)");
          grad.addColorStop(1, "rgba(255, 255, 255, 0)");
          
          glowCtx.fillStyle = grad;
          glowCtx.beginPath();
          glowCtx.arc(px, py, radius, 0, Math.PI * 2);
          glowCtx.fill();
        }

        if (drawn < totalPixels) {
          animId = requestAnimationFrame(frame);
        } else {
          finishAnimation();
        }
      }
      animId = requestAnimationFrame(frame);
    }

    function finishAnimation() {
      running = false;
      replayBtn.disabled = false;
      glowCtx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
      stage.classList.add("zoomed");
      captionEl.textContent = CAPTION_TEXT;
      setTimeout(() => captionEl.classList.add("visible"), 300);
      
      // Вибрация успеха в конце
      try { tg?.HapticFeedback?.notificationOccurred("success"); } catch (_) {}
    }

    replayBtn.addEventListener("click", () => {
      if (running) return;
      if (animId) cancelAnimationFrame(animId);
      startAnimation();
    });

    // Автоматический запуск при загрузке страницы
    window.addEventListener("load", () => {
      setTimeout(startAnimation, 300);
    });
  </script>
</body>
